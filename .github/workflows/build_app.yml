name: Compilar_Canary_APK
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_Codigo
        uses: actions/checkout@v4
      
      - name: Configurar_Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Configurar_Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Baixar_Pacotes
        run: flutter pub get
      
      - name: Rodar_Testes
        run: flutter test
        
      # 🚀 PASSO 1: Reconstrói a estrutura nativa de arquivos limpos
      - name: Gerar_Configuracoes_Nativas_Android
        run: flutter create . --platforms=android
        
      # 🚀 PASSO 2: Injeção de Segurança via Overwrite - Força o suporte ao Android SDK 36 e Java 8 Desugaring
      - name: Configurar_Java8_Desugaring_Blindado
        run: |
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.example.canary_control_pro"
              compileSdk 36 // 🔥 Atualizado para a versão 36 exigida pelo SQLite moderno

              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = "1.8"
              }

              defaultConfig {
                  applicationId "com.example.canary_control_pro"
                  minSdk 21
                  targetSdk 34 // Mantém o comportamento de runtime estável
                  versionCode 1
                  versionName "1.0.0"
                  multiDexEnabled true
              }
          }

          dependencies {
              coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
          }
          EOF
          
      # 🚀 PASSO 3: Executa o empacotamento completo do instalador móvel
      - name: Compilar_Instalador
        run: flutter build apk --debug
        
      - name: Criar_Artefato_Disponivel
        uses: actions/upload-artifact@v4
        with:
          name: meu-canaril-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          
