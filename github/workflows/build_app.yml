name: 🚀 Compilar CanaryControl Pro (Instalação e Testes)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4 # Atualizado para v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4 # Atualizado para v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Instalar Dependências
      run: flutter pub get

    - name: Executar Testes Unitários
      run: flutter test

    - name: Compilar APK de Testes
      run: flutter build apk --debug

    # Sistema de Upload v4 corrigido com busca dinâmica por arquivos .apk
    - name: Disponibilizar Instalador (.APK)
      uses: actions/upload-artifact@v4 
      with:
        name: canary-control-pro-teste
        path: build/app/outputs/flutter-apk/app-debug.apk
        if-no-files-found: error # Faz a automação falhar explicitamente caso não ache o arquivo
        
