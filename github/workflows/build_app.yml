name: 🚀 Compilar CanaryControl Pro (Instalação e Testes)

on:
  push:
    branches: [ main ] # Compila sempre que você salvar alterações na branch principal
  workflow_dispatch: # Adiciona o botão manual na aba Actions

# 🔑 LIBERAÇÃO DE SEGURANÇA: Permite que o script crie links de downloads de arquivos
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Flutter Estável
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Instalar Dependências do SQLite
      run: flutter pub get

    - name: Executar Testes Unitários
      run: flutter test

    - name: Compilar APK Móvel
      run: flutter build apk --debug

    # Cria a página de liberação com o arquivo .apk anexado para download
    - name: Publicar Instalador (.APK) nas Releases
      uses: softprops/action-gh-release@v2
      with:
        files: build/app/outputs/flutter-apk/app-debug.apk
        tag_name: v1.0.${{ github.run_number }}
        name: CanaryControl Pro - Teste Prático v1.0.${{ github.run_number }}
        body: |
          🦅 O seu instalador APK do Canaril foi gerado com sucesso na nuvem!
          
          📦 **Como instalar no smartphone:**
          1. Baixe o arquivo `app-debug.apk` listado logo abaixo.
          2. Transfira para o seu celular Android.
          3. Abra o arquivo e autorize a instalação no aparelho.
          
