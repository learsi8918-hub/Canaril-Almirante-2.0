name: 🚀 Compilar CanaryControl Pro (Instalação e Testes)

on:
  push:
    tags:
      - 'v*' # Dispara a compilação de APK sempre que você criar uma tag de versão (Ex: v1.0.0)
  workflow_dispatch: # Adiciona um botão manual "Run workflow" na aba Actions para você forçar o APK quando quiser

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Instalar Dependências
      run: flutter pub get

    - name: Executar Testes Unitários
      run: flutter test

    - name: Compilar APK de Testes
      run: flutter build apk --debug

    # Força a criação de uma página de download oficial (Release) no seu GitHub
    - name: Criar Link de Download Oficial (Release APK)
      uses: softprops/action-gh-release@v2
      with:
        files: build/app/outputs/flutter-apk/app-debug.apk
        tag_name: v1.0.${{ github.run_number }}
        name: CanaryControl Pro - Versão de Testes v1.0.${{ github.run_number }}
        body: |
          🚀 O seu instalador APK do Canaril foi gerado com sucesso!
          
          📦 **Como instalar:**
          1. Baixe o arquivo `app-debug.apk` anexado abaixo.
          2. Transfira para o seu celular Android.
          3. Abra o arquivo e autorize a instalação.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
